<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iRPC WASM Node - メッセージ送信デモ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      --card-bg: rgba(30, 41, 59, 0.75);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent-primary: #818cf8;
      --accent-secondary: #c084fc;
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #34d399;
      --warning: #fbbf24;
      --error: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 620px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .header-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 1.25rem;
      padding: 1.75rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .header-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--accent-gradient);
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.4rem;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1rem;
      padding: 0.4rem 1rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--warning);
      box-shadow: 0 0 8px var(--warning);
      animation: pulse 2s infinite;
    }

    .status-dot.ready {
      background-color: var(--accent-primary);
      box-shadow: 0 0 8px var(--accent-primary);
    }

    .status-dot.active {
      background-color: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 1.25rem;
      padding: 1.75rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .step-section {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .hidden {
      display: none !important;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input[type="text"] {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 0.75rem;
      padding: 0.9rem 1.1rem;
      color: var(--text-main);
      font-family: inherit;
      font-size: 1rem;
      transition: all 0.2s ease;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }

    .btn {
      width: 100%;
      background: var(--accent-gradient);
      color: #ffffff;
      border: none;
      border-radius: 0.75rem;
      padding: 0.95rem;
      font-family: inherit;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(168, 85, 247, 0.5);
    }

    .btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      font-size: 0.85rem;
      padding: 0.4rem 0.8rem;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
      color: var(--text-main);
    }

    .user-info-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--card-border);
      border-radius: 0.75rem;
    }

    .user-name-tag {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 600;
      color: var(--accent-secondary);
    }

    .input-row {
      display: flex;
      gap: 0.75rem;
    }

    .input-row input {
      flex: 1;
    }

    .input-row .btn-send {
      width: auto;
      padding: 0.9rem 1.75rem;
      white-space: nowrap;
    }

    .log-card {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .log-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .log-container {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--card-border);
      border-radius: 0.75rem;
      height: 260px;
      overflow-y: auto;
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.875rem;
    }

    .log-entry {
      background: rgba(30, 41, 59, 0.7);
      border-left: 3px solid var(--accent-primary);
      padding: 0.65rem 0.85rem;
      border-radius: 0.35rem;
      animation: fadeIn 0.25s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .log-sender {
      color: var(--accent-secondary);
      font-weight: 600;
      margin-right: 0.5rem;
    }

    .log-text {
      color: var(--text-main);
      word-break: break-all;
    }

    .log-time {
      color: var(--text-muted);
      font-size: 0.75rem;
      margin-left: 0.5rem;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header-card">
      <h1>iRPC WASM Messenger</h1>
      <p class="subtitle">WebRTC DataChannel リアルタイムメッセージ送信</p>
      <div class="status-badge">
        <span id="statusDot" class="status-dot"></span>
        <span id="statusText">WASM モジュール読み込み中...</span>
      </div>
    </div>

    <!-- Step 1: Name Input Form -->
    <div id="step1" class="card step-section">
      <div class="form-group">
        <label for="nameInput">名前を入力してください (Name)</label>
        <input type="text" id="nameInput" placeholder="例: Alice" value="Alice" autofocus>
      </div>

      <div class="form-group">
        <label for="hostInput">ホスト ID (Host ID)</label>
        <input type="text" id="hostInput" value="d7f31e58-894b-41f3-83dc-94c01b8aec21">
      </div>

      <button id="connectBtn" class="btn" disabled>
        <span>次へ (メッセージ入力へ) &rarr;</span>
      </button>
    </div>

    <!-- Step 2: Message Input & Log View (Initially Hidden) -->
    <div id="step2" class="card step-section hidden">
      <div class="user-info-bar">
        <div class="user-name-tag">
          <span>&#128100;</span>
          <span id="currentNameTag">Alice</span>
        </div>
        <button id="changeNameBtn" class="btn-secondary">名前変更</button>
      </div>

      <div class="form-group">
        <label for="messageInput">メッセージを入力して送信 (Message)</label>
        <div class="input-row">
          <input type="text" id="messageInput" placeholder="メッセージを入力してください..." autocomplete="off">
          <button id="sendBtn" class="btn btn-send">送信</button>
        </div>
      </div>

      <div class="log-card">
        <div class="log-header">
          <span class="log-title">送信ログ (Message History)</span>
        </div>
        <div id="logContainer" class="log-container">
          <div id="emptyLogHint" style="color: var(--text-muted); text-align: center; padding: 2.5rem;">
            メッセージを入力して送信してください
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="wasm_exec.js"></script>
  <script>
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');

    const step1 = document.getElementById('step1');
    const step2 = document.getElementById('step2');

    const nameInput = document.getElementById('nameInput');
    const hostInput = document.getElementById('hostInput');
    const connectBtn = document.getElementById('connectBtn');

    const currentNameTag = document.getElementById('currentNameTag');
    const changeNameBtn = document.getElementById('changeNameBtn');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const logContainer = document.getElementById('logContainer');
    const emptyLogHint = document.getElementById('emptyLogHint');

    let currentName = 'Guest';
    let isFirstLog = true;

    // Load Go WASM
    const go = new Go();
    WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject)
      .then((result) => {
        go.run(result.instance);
        statusDot.className = 'status-dot ready';
        statusText.textContent = '準備完了 (WASM Ready)';
        connectBtn.disabled = false;
      })
      .catch((err) => {
        console.error("WASM 読み込み失敗:", err);
        statusText.textContent = 'WASM 読み込みエラー';
      });

    // Callback invoked from Go whenever a message is sent
    window.onMessageSent = function(name, text) {
      if (emptyLogHint && emptyLogHint.parentNode) {
        emptyLogHint.remove();
      }
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      const timeStr = new Date().toLocaleTimeString();
      entry.innerHTML = `
        <div>
          <span class="log-sender">[${escapeHtml(name)}]</span>
          <span class="log-text">${escapeHtml(text)}</span>
        </div>
        <span class="log-time">${timeStr}</span>
      `;
      logContainer.appendChild(entry);
      logContainer.scrollTop = logContainer.scrollHeight;
    };

    // Step 1 -> Step 2 transition
    connectBtn.addEventListener('click', () => {
      currentName = nameInput.value.trim() || 'Guest';
      const host = hostInput.value.trim();

      // Start WASM RunNode
      if (typeof window.RunNode === 'function') {
        window.RunNode(currentName, host);
      }

      currentNameTag.textContent = currentName;
      statusDot.className = 'status-dot active';
      statusText.textContent = `接続完了 (${currentName})`;

      // Switch views
      step1.classList.add('hidden');
      step2.classList.remove('hidden');
      messageInput.focus();
    });

    // Step 2 -> Step 1 transition (Change name)
    changeNameBtn.addEventListener('click', () => {
      step2.classList.add('hidden');
      step1.classList.remove('hidden');
      nameInput.focus();
    });

    // Send Message
    sendBtn.addEventListener('click', handleSend);
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        handleSend();
      }
    });

    function handleSend() {
      const text = messageInput.value.trim();
      if (!text) return;

      if (typeof window.SendMessage === 'function') {
        window.SendMessage(text, currentName);
        messageInput.value = '';
        messageInput.focus();
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
